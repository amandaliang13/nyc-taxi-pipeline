[project]
name = "nyc-taxi-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.81",
    "dbt-core>=1.12.3",
    "dbt-postgres>=1.11.0",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.2",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.2.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
# ingestion/ isn't an installed package; put the repo root on sys.path.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"psycopg2".msg = "Use psycopg (3). psycopg2 is only dbt-postgres's internal driver."
