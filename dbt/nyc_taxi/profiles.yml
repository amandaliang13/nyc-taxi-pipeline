nyc_taxi:
  target: dev
  outputs:
    dev: &warehouse
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT') | as_number }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: public
      threads: 4
    # pytest only: the same server, a throwaway nyc_taxi_test_* database.
    # The fixture sets DBT_TEST_DBNAME; never put it in .env.
    test:
      <<: *warehouse
      dbname: "{{ env_var('DBT_TEST_DBNAME') }}"
