version: 2

seeds:
  - name: taxi_zone_lookup
    description: >
      TLC taxi zone lookup (https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv).
      TLC publishes a single undated file that is overwritten in place; known revisions
      only touched placeholder rows 264/265 and added service_zone, with no effective
      dates. Changes to this committed copy are recorded by taxi_zone_lookup_snapshot.
    columns:
      - name: locationid
        data_tests: [unique, not_null]

  - name: congestion_relief_zone
    description: >
      Taxi zones inside the MTA Congestion Relief Zone (CBD Tolling Program), the
      source of dim_zones' Type 2 attribute. location_id comes from the MTA dataset
      "MTA Central Business District Taxi Zones" (Metropolitan Transportation Authority,
      data.ny.gov yfdc-w5jh,
      https://data.ny.gov/api/views/yfdc-w5jh/rows.csv?accessType=DOWNLOAD;
      issued 2024-08-16, modified 2024-09-04; downloaded 2026-11-04; 38 zones), with
      the Polygon column dropped. effective_from is not in the source: it was added
      here as the tolling start date, 2025-01-05. After changing this file, follow the
      README runbook (fact_trips must be rebuilt).
      Cross-check (2026-05, valid trips that start and end in the same zone, zones with
      at least 100 such trips): the share charged cbd_congestion_fee is 68-98% in the
      35 listed zones and 3% on average elsewhere. The outliers are zones on the 60th St
      boundary that MTA left out, where a same-zone trip can still enter the CRZ:
      Lincoln Square East 44%, Central Park 33%, Upper East Side South 26%, Lincoln
      Square West 21%, Lenox Hill West 19%, Lenox Hill East 16%.
    columns:
      - name: location_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('taxi_zone_lookup')
                field: locationid
      - name: effective_from
        data_tests: [not_null]

  - name: rate_codes
    description: >
      RatecodeID values from the TLC Yellow Taxi Trip Records data dictionary
      (version dated March 18, 2025):
      https://www.nyc.gov/assets/tlc/downloads/pdf/data_dictionary_trip_records_yellow.pdf
    columns:
      - name: rate_code_id
        data_tests: [unique, not_null]

  - name: payment_types
    columns:
      - name: payment_type_id
        data_tests: [unique, not_null]

  - name: vendors
    columns:
      - name: vendor_id
        data_tests: [unique, not_null]

  - name: us_holidays
    description: >
      US federal holidays on their actual dates (no observed substitutes), generated
      by scripts/generate_us_holidays.py with the `holidays` package (0.108). Covers
      the dim_date spine; regenerate after widening it.
    columns:
      - name: holiday_date
        data_tests: [unique, not_null]
